<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>ThinkOS Operations Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* Layout: Matter Platform shell — 55px header, map left, tabbed aside right; stacks on phones. */
:root{
  --bg:#ffffff; --sub:#f8f9fa; --fg:#101113; --muted:#495057; --dim:#6c757d; --line:#dee2e6;
  --accent:#40c057; --accent-strong:#2b8a3e; --on-accent:#ffffff; --accent-soft:#ebfbee;
  --high:#e03131; --high-soft:#fff5f5; --med:#f59f00; --med-ink:#8f5b00; --med-soft:#fff9db; --off:#868e96;
  --land:#f1f1ee; --road:#ffffff; --road-edge:#dcdcd6; --water:#bfdbee; --park:#d6ebcf; --maplabel:#6c757d;
  --font:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1a1b1e; --sub:#25262b; --fg:#e9ecef; --muted:#c1c2c5; --dim:#a6a7ab; --line:#373a40;
  --accent:#51cf66; --accent-strong:#2b8a3e; --on-accent:#ffffff; --accent-soft:#1f3324;
  --high:#fa5252; --high-soft:#3b1d1d; --med:#fcc419; --med-ink:#ffd43b; --med-soft:#3a3116; --off:#909296;
  --land:#2a2b30; --road:#3a3b41; --road-edge:#2f3035; --water:#1d3345; --park:#25382a; --maplabel:#a6a7ab;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#1a1b1e; --sub:#25262b; --fg:#e9ecef; --muted:#c1c2c5; --dim:#a6a7ab; --line:#373a40;
  --accent:#51cf66; --accent-strong:#2b8a3e; --on-accent:#ffffff; --accent-soft:#1f3324;
  --high:#fa5252; --high-soft:#3b1d1d; --med:#fcc419; --med-ink:#ffd43b; --med-soft:#3a3116; --off:#909296;
  --land:#2a2b30; --road:#3a3b41; --road-edge:#2f3035; --water:#1d3345; --park:#25382a; --maplabel:#a6a7ab;
  color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;display:flex;flex-direction:column}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-strong);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hdr{flex:none;min-height:55px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.iconbtn{width:40px;height:40px;border-radius:8px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center}
.iconbtn:hover{background:var(--sub)}
.org{min-height:36px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:0 10px;max-width:280px;min-width:0;flex:0 1 280px}
.brand{display:inline-flex;align-items:center;flex:none}.brand img{height:22px;width:auto;display:block}.brand .lw{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand .lg{display:none}:root:not([data-theme="light"]) .brand .lw{display:block}}
:root[data-theme="dark"] .brand .lg{display:none}:root[data-theme="dark"] .brand .lw{display:block}
.hdr .sp{flex:1}
.user{color:var(--muted);font-size:13px;white-space:nowrap}
.main{flex:1;min-height:0;display:flex}
.mapwrap{flex:1 1 0;min-width:0;position:relative;overflow:hidden;background:var(--land);touch-action:none}
#fb,#mbx{position:absolute;inset:0}
#fb svg{width:100%;height:100%;display:block}
#mkLayer{position:absolute;inset:0;pointer-events:none}
#mkLayer .mkw{pointer-events:auto}
.mkw{position:absolute;width:0;height:0}
.mk{position:absolute;left:0;top:0;transform:translate(-50%,-50%);border:0;background:transparent;padding:0;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.mk .s{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--fg);background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.3);position:relative}
.mk svg.i{width:14px;height:14px;stroke-width:2.2}
.mk.sensor .s,.mk.combo .s{width:32px;height:32px;border-radius:50%;border:3px solid var(--accent)}
.mk.lock .s{width:30px;height:30px;border-radius:8px;background:var(--accent-strong);color:var(--on-accent)}
.mk.camera .s{width:48px;height:28px;border-radius:5px;border:2px solid var(--accent);border-top-width:5px;gap:3px}
.mk.oil .s{width:30px;height:30px;border-radius:50% 0 50% 50%;transform:rotate(-45deg);border:3px solid var(--accent)}
.mk.oil .s b{transform:rotate(45deg);font-weight:600}
.mk.l-med .s{border-color:var(--med)}
.mk.l-high .s{border-color:var(--high);background:var(--high);color:#fff}
.mk.l-off .s{border-color:var(--off);border-style:dashed;color:var(--dim)}
.mk.lock.l-med .s{background:var(--med);color:#101113}
.mk.lock.l-high .s{background:var(--high);color:#fff}
.mk .lk{position:absolute;right:-7px;bottom:-7px;width:17px;height:17px;border-radius:5px;background:var(--accent-strong);color:#fff;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--bg)}
.mk .lk svg.i{width:10px;height:10px;stroke-width:2.6}
.mk .n{position:absolute;left:-9px;top:-9px;min-width:18px;height:18px;border-radius:9px;background:var(--fg);color:var(--bg);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.mk.oil .n{transform:rotate(45deg)}
.mk.sel .s{outline:3px solid var(--fg);outline-offset:2px}
.mk.done .s{opacity:.45}
.depot{position:absolute;transform:translate(-50%,-50%);background:var(--fg);color:var(--bg);font-size:10px;font-weight:600;letter-spacing:.04em;padding:3px 7px;border-radius:4px;white-space:nowrap}
.layers{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:2px;max-width:calc(100% - 24px);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.lytog{border:0;background:transparent;text-align:left;padding:2px 6px 4px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);cursor:default}
.layers label{display:flex;align-items:center;gap:8px;min-height:34px;padding:0 6px;border-radius:6px;cursor:pointer;font-size:13px}
.layers label:hover{background:var(--sub)}
.layers input{width:16px;height:16px;accent-color:var(--accent-strong)}
.layers .cnt{margin-left:auto;padding-left:10px;color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
.key{width:18px;height:14px;display:inline-block;border:2.5px solid var(--accent);background:var(--bg);flex:none}
.key.sensor,.key.combo{border-radius:50%;width:14px}.key.lock{border-radius:4px;background:var(--accent-strong);border-color:var(--accent-strong);width:14px}
.key.camera{border-radius:3px;border-top-width:4px}.key.oil{border-radius:50% 0 50% 50%;transform:rotate(-45deg);width:13px;height:13px}
.key.route{border:0;border-top:3px dashed var(--fg);height:0;background:transparent}
.mapctl{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.mapsrc{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;max-width:min(300px,calc(100% - 24px))}
.chipbtn{border:1px solid var(--line);background:var(--bg);border-radius:999px;min-height:32px;padding:0 12px;font-size:12px;display:inline-flex;align-items:center;gap:6px}
.pop{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:8px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.pop input{min-height:36px;border:1px solid var(--line);border-radius:6px;padding:0 8px;background:var(--bg);width:100%}
.aside{flex:0 1 46%;max-width:750px;min-width:0;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.counts{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:flex-end;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--dim);padding:8px 16px 0;font-variant-numeric:tabular-nums}
.counts b{font-weight:500;color:var(--accent-strong)}
:root[data-theme="dark"] .counts b{color:var(--accent)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:0 16px;overflow-x:auto}
.tab{border:0;background:transparent;min-height:42px;padding:0 14px;display:inline-flex;align-items:center;gap:8px;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab[aria-selected="true"]{border-bottom-color:var(--accent);font-weight:500}
.tab .bdg{background:var(--high);color:#fff;font-size:11px;font-weight:600;border-radius:999px;padding:0 7px}
.panel{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.card{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--bg);display:flex;flex-direction:column;gap:10px}
.card.sub{background:var(--sub);border-color:transparent}
h1{font-size:16px;font-weight:700;margin:0;text-wrap:balance}
h3{font-size:14px;font-weight:600;margin:0}
.addr{color:var(--dim);font-size:12px;display:flex;gap:6px;align-items:center}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:2px 8px;color:var(--muted);background:var(--sub)}
.badge{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:2px 8px;background:var(--accent-strong);color:#fff;white-space:nowrap}
.badge.high{background:var(--high)}.badge.med{background:var(--med-soft);color:var(--med-ink);border:1px solid var(--med)}.badge.off{background:var(--off)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row .sp{flex:1}
.meta{color:var(--dim);font-size:12px}
.btn{min-height:40px;border-radius:6px;border:1px solid var(--line);background:var(--bg);padding:0 14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--sub)}
.btn.pri{background:var(--accent-strong);border-color:var(--accent-strong);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{min-height:32px;padding:0 10px;font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--bg);min-height:36px;padding:0 12px;font-size:12px;font-weight:500;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-strong);color:#fff}
.voice{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--sub)}
.mic{width:52px;height:52px;border-radius:50%;border:0;background:var(--accent-strong);color:#fff;display:inline-flex;align-items:center;justify-content:center;flex:none}
.mic svg.i{width:24px;height:24px}
.mic.on{background:var(--high);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(224,49,49,.2)}}
@media (prefers-reduced-motion: reduce){.mic.on{animation:none}}
.voice input{flex:1;min-width:0;min-height:40px;border:1px solid var(--line);border-radius:6px;padding:0 10px;background:var(--bg)}
.say{display:flex;flex-wrap:wrap;gap:6px}
.log{font-size:13px;display:flex;flex-direction:column;gap:4px}
.log .you{color:var(--dim)}.log .os{font-weight:500}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.pitem{width:100%;text-align:left;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:10px 12px;display:flex;gap:12px;align-items:flex-start}
.pitem:hover{background:var(--sub)}
.pitem.sel{border-color:var(--accent-strong);background:var(--accent-soft)}
.rank{width:26px;height:26px;border-radius:50%;background:var(--fg);color:var(--bg);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.pitem .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pitem .nm{font-weight:600}
.pitem .why{font-size:12px;color:var(--muted)}
.pitem .rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.stat{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stat .l{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat .v{font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}.dot.high{background:var(--high)}.dot.med{background:var(--med)}.dot.off{background:var(--off)}
.stop{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stop .body{flex:1;min-width:0}
.stop .nm{font-weight:500;overflow-wrap:anywhere}
.bar{height:10px;border-radius:999px;background:var(--sub);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.med{background:var(--med)}.bar i.high{background:var(--high)}
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:var(--font);font-size:10px;fill:var(--dim)}
.cam{border-radius:8px;overflow:hidden;position:relative;background:#22272b}
.cam svg{display:block;width:100%;height:auto}
.cam .bx{position:absolute;border:2px solid #ff8787;border-radius:3px}
.cam .bx span{position:absolute;left:-2px;top:-20px;background:#c92a2a;color:#fff;font-size:10px;font-weight:600;padding:1px 6px;border-radius:3px;white-space:nowrap}
.cam .cap{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.7);color:#fff;font-size:10px;font-weight:600;letter-spacing:.06em;padding:3px 8px;border-radius:999px}
.ev{font-size:13px;display:flex;gap:10px}.ev time{color:var(--dim);font-variant-numeric:tabular-nums;flex:none;width:92px}
.note{font-size:12px;color:var(--dim)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
.sample{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border:1px dashed var(--line);border-radius:4px;padding:2px 8px;color:var(--dim);white-space:nowrap}
@media (max-width: 899px){
  html,body{height:auto}
  .main{flex-direction:column}
  .mapwrap{flex:none;height:56vh;min-height:340px}
  .aside{flex:none;max-width:none;border-left:0;border-top:1px solid var(--line)}
  .panel{overflow:visible;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .user,.org{display:none}
  .layers label{min-height:30px}
  .layers:not(.open) label{display:none}
  .lytog{cursor:pointer;min-height:32px;padding:0 8px;color:var(--fg)}
  .lytog::after{content:" ▾"}
}

/* Matter Platform style markers on live Mapbox: 3D bin on a status disc */
.mbmode .mk{transform:translate(-50%,calc(-100% + 12px));width:40px;height:52px;align-items:flex-end;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.mbmode .mk .s{display:none}
.pin{position:relative;width:40px;height:52px;display:block}
.pin .disc{position:absolute;left:0;bottom:-2px;width:40px;height:28px;border-radius:50%;background:var(--st,#40c057);border:4px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.pin svg{position:absolute;left:7px;bottom:11px;width:26px;height:36px;overflow:visible}
.pin img.binimg{position:absolute;left:3.6px;top:6.1px;width:34px;height:43px;max-width:none;max-height:none;display:block;object-fit:fill}
.pin .lk{position:absolute;right:-2px;top:6px;width:16px;height:16px;border-radius:5px;background:#205C40;color:#fff;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff}
.pin .lk svg{position:static;width:10px;height:10px;stroke:#fff;fill:none;stroke-width:2.6}
.pin .n{position:absolute;left:-6px;top:0;min-width:18px;height:18px;border-radius:9px;background:#101113;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.mbmode .mk.oil .n{transform:none}
.mk.sel .pin .disc{border-color:#101113}
.mk.sel .pin{transform:scale(1.18);transform-origin:50% 100%}
.mk.done .pin{opacity:.45}
.mbmode .depot{transform:translate(-50%,-50%)}
.mapctl .iconbtn.on{background:var(--accent-soft);color:var(--accent-strong)}
.mapwrap.loading #fb,.mapwrap.loading #mkLayer{visibility:hidden}
.mapwrap .ldg{display:none}
.mapwrap.loading .ldg{display:flex;position:absolute;inset:0;align-items:center;justify-content:center;gap:10px;color:var(--dim);font-size:13px;background:var(--land)}
.ldg i{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent-strong);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.soon{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:#F19E21;color:#101113;border-radius:999px;padding:1px 7px;margin-left:4px;white-space:nowrap}
.mapctl .sep{width:1px;background:var(--line);margin:6px 2px}
#mbx .mapboxgl-ctrl-logo{margin-left:6px}
</style>

/* Priority: why an asset needs a visit now, most urgent first. */
function pr(a){
 if(a.done) return null;
 if(a.lock==='tamper') return {score:100,lvl:'high',why:'Tamper alert on the lock'};
 if(a.banned) return {score:96,lvl:'high',why:'Banned item on camera: '+a.banned.toLowerCase()};
 if(a.type==='oil'&&a.fill>=80) return {score:80+a.fill/10,lvl:'high',why:'Oil tank '+a.fill+'% full ('+Math.round(a.cap*a.fill/100)+' of '+a.cap+' L)'};
 if(a.fill>=85&&!a.offline) return {score:78+a.fill/10,lvl:'high',why:a.fill+'% full, overflow risk'};
 if(a.offline) return {score:60,lvl:'med',why:'Offline for '+a.offline+' h, last reading '+a.fill+'%'};
 if(a.lock==='unlocked') return {score:55,lvl:'med',why:'Left unlocked for '+a.openH+' h'};
 if(a.night) return {score:52,lvl:'med',why:'Fill jumped overnight at '+a.night+', possible dumping'};
 if(a.fill>=70) return {score:40+a.fill/10,lvl:'med',why:a.fill+'% full, due soon'};
 return null;
}

  .sort(function(x,y){return y.p.score-x.p.score;});
}
function km(p,q){var R=6371,r=Math.PI/180,dla=(q.lat-p.lat)*r,dlo=(q.lng-p.lng)*r;

function optimise(ids){var left=ids.slice(),out=[],cur=DEPOT;
 while(left.length){var bi=0,bd=1e9;left.forEach(function(id,i){var d=km(cur,byId[id]);if(d<bd){bd=d;bi=i;}});cur=byId[left[bi]];out.push(left.splice(bi,1)[0]);}
 return out;}

  var ev=a.lock==='tamper'?[['Today 05:31','Forced-open attempt, lock held'],['Today 05:29','Lid lifted while upright'],['Mon 06:10','Unlocked by truck tip']]
   :a.lock==='unlocked'?[['Today 02:47','Unlocked, not re-latched'],['Mon 06:22','Unlocked by truck tip'],['Mon 06:23','Locked']]
   :[['Mon 06:12','Unlocked by truck tip'],['Mon 06:13','Locked'],['Thu 06:08','Unlocked by truck tip']];
  h+='<div class="card"><div class="row"><h3>GravityLock</h3><span class="sp"></span><span class="badge'+(a.lock==='tamper'?' high':a.lock==='unlocked'?' med':'')+'">'+st+'</span></div>'
   +ev.map(function(e){return '<div class="ev"><time>'+e[0]+'</time><span>'+e[1]+'</span></div>';}).join('')
   +'<div class="note">The lock opens only when the truck tips the bin, which keeps the wrong waste out between collections.</div></div>';
 }
 if(a.type==='camera'){
  h+='<div class="card"><div class="row"><h3>External camera</h3><span class="sp"></span><span class="meta">Radar fill '+a.fill+'%</span></div><div class="cam">'
   +'<svg viewBox="0 0 800 440" role="img" aria-label="Camera still of an open-top bin from above"><rect width="800" height="440" fill="#2a332d"/><rect y="340" width="800" height="100" fill="#3a433c"/><polygon points="150,120 650,120 720,380 80,380" fill="#4a5a4f" stroke="#7e8f83" stroke-width="4"/><polygon points="175,140 625,140 685,360 115,360" fill="#5e5a4e"/><rect x="200" y="200" width="140" height="70" fill="#7a6e58" transform="rotate(-8 270 235)"/><rect x="380" y="180" width="170" height="50" fill="#8b8170" transform="rotate(6 465 205)"/><rect x="300" y="262" width="200" height="60" fill="#6d7a70"/>'
   +(a.banned?'<rect x="232" y="282" width="30" height="70" rx="12" fill="#c9c6bd"/>':'')+'</svg>'
   +(a.banned?'<div class="bx" style="left:27.500%;top:61%;width:7%;height:21%"><span>'+esc(a.banned.toUpperCase())+' 0.93</span></div>':'')
   +'<span class="cap">'+a.id+' · STILL 05:38</span></div>'+barHtml(a.fill)
   +'<div class="note">'+(a.banned?'Remove the banned item before pickup, or the load may be rejected.':a.night?'Radar saw the fill jump at '+a.night+' with the site closed. The camera lit up and took a snapshot.':'No banned items in the latest still.')+'</div></div>';
 }
 return h;
}
function panelOverview(){
 var c={high:0,med:0,low:0,off:0};A.forEach(function(a){c[level(a)]++;});
 var h='<div class="stats"><div class="stat"><div class="l"><span class="dot high"></span>High</div><div class="v">'+c.high+'</div></div><div class="stat"><div class="l"><span class="dot med"></span>Medium</div><div class="v">'+c.med+'</div></div><div class="stat"><div class="l"><span class="dot"></span>Low</div><div class="v">'+c.low+'</div></div><div class="stat"><div class="l"><span class="dot off"></span>Offline</div><div class="v">'+c.off+'</div></div></div><div class="card"><h3>Assets by layer</h3>';
 Object.keys(TYPES).forEach(function(t){var L=A.filter(function(a){return a.type===t;}),n=L.filter(function(a){return pr(a);}).length;
  h+='<div class="row"><span class="key '+t+'"></span><span>'+esc(TYPES[t].label)+'</span><span class="sp"></span><span class="meta">'+L.length+' assets · '+n+' need a visit</span></div>';});
 return h+'</div><div class="note">All readings on this page are sample data for the prototype.</div>';
}
function render(){
 var pc=A.filter(function(a){return pr(a);}).length;$('pcount').textContent=pc;
 ['priority','route','detail','overview'].forEach(function(t){$('t-'+t).setAttribute('aria-selected',S.tab===t);});
 var on=A.filter(function(a){return !a.offline;}).length;
 $('counts').innerHTML='<span>Online: <b>'+on+'</b></span><span>Active: '+A.length+'</span><span>Priority: '+pc+'</span><span>Total: '+A.length+'</span>';
 $('panel').innerHTML=S.tab==='priority'?panelPriority():S.tab==='route'?panelRoute():S.tab==='detail'?panelDetail():panelOverview();
 paintMarkers();setRouteLine();
}
function select(id,goDetail){S.sel=id;if(goDetail)S.tab='detail';render();fly(byId[id]);}
var toastT;function toast(t){var el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){el.hidden=true;},3200);}
function markDone(a){a.done=true;if(a.fill!=null&&!a.offline)a.fill=a.type==='oil'?4:2;if(a.lock)a.lock='locked';a.banned=null;a.night=null;a.offline=null;
 var i=S.route.indexOf(a.id);if(i>=0)S.route.splice(i,1);}

/* ---------- Voice ---------- */
function speak(t){try{var u=new SpeechSynthesisUtterance(t);u.lang='en-AU';window.speechSynthesis.cancel();window.speechSynthesis.speak(u);}catch(e){}}
function command(q){
 var t=q.toLowerCase().replace(/hey,? think ?os,?/,'').trim(),P=priorities(),ans,m;
 var LK=[['route','route'],['oil','oil'],['camera','camera'],['skip','camera'],['roll','camera'],['sensor lock','combo'],['combined','combo'],['gravity','lock'],['lock','lock'],['sensor','sensor']];
 if((m=t.match(/\b(show|hide|only)\b/))){
  var hit=null;LK.some(function(k){if(t.indexOf(k[0])>=0){hit=k[1];return true;}return false;});
  if(hit){if(m[1]==='only'){Object.keys(TYPES).forEach(function(k){S.layers[k]=k===hit;});}else S.layers[hit]=m[1]==='show';
   syncLayers();if(hit==='oil'&&m[1]!=='hide'){S.run='oil';S.tab='priority';}
   ans=(m[1]==='hide'?'Hiding ':'Showing ')+(hit==='route'?'the route':TYPES[hit].label.toLowerCase())+'.';}
  else ans='Which layer? Try sensors, locks, cameras, oil or route.';
 } else if(/done|collected|lifted|emptied|complete|checked/.test(t)){
  var a=byId[S.sel];if(!a||a.done)a=P[0]&&P[0].a;if(a&&!a.done){markDone(a);ans=a.name+' marked done.';var nx=priorities()[0];if(nx){ans+=' Next: '+nx.a.name+'.';S.sel=nx.a.id;fly(nx.a);}}else ans='Nothing is selected to mark done.';
 } else if(/route|start (the )?run|navigate|directions/.test(t)){
  buildRoute();S.tab='route';S.layers.route=true;syncLayers();ans=S.route.length?'Route built: '+S.route.length+' stops, about '+routeKm().toFixed(1)+' kilometres. First stop: '+byId[S.route[0]].name+'.':'There are no priority pick-ups to route.';
 } else if(/next|first|where (to|do i)/.test(t)){
  if(P[0]){S.sel=P[0].a.id;S.tab='priority';fly(P[0].a);ans='Next pick-up: '+P[0].a.name+'. '+P[0].p.why+'.';}else ans='No priority pick-ups right now.';
 } else if(/priorit|list|read|how many|pick.?ups?/.test(t)){
  S.tab='priority';ans=P.length?P.length+' priority pick-ups. '+P.slice(0,3).map(function(x,i){return (i+1)+': '+x.a.name+', '+x.p.why.toLowerCase();}).join('. ')+'.':'No priority pick-ups right now.';
 } else ans='I didn’t catch that. Try “what’s next”, “read my priorities”, “show oil collections”, “start route” or “mark it done”.';
 S.log.push({q:q,a:ans});render();speak(ans);
}
function startMic(){
 var SR=window.SpeechRecognition||window.webkitSpeechRecognition,note=$('micNote'),mic=$('mic');
 if(!SR){note.textContent='Voice input isn’t available in this browser. Tap a phrase or type the command.';return;}
 var r;try{r=new SR();}catch(e){note.textContent='Voice input isn’t available here. Tap a phrase or type the command.';return;}
 r.lang='en-AU';r.interimResults=false;
 r.onstart=function(){mic.classList.add('on');note.textContent='Listening…';};
 r.onresult=function(e){command(e.results[0][0].transcript);};
 r.onerror=function(){var n=$('micNote');if(n)n.textContent='The microphone is blocked in this preview. Tap a phrase or type the command.';};
 r.onend=function(){var m=$('mic');if(m)m.classList.remove('on');};
 try{r.start();}catch(e){note.textContent='The microphone is blocked in this preview. Tap a phrase or type the command.';}
}

/* ---------- Wiring ---------- */
function syncLayers(){Array.prototype.forEach.call(document.querySelectorAll('#layers input'),function(i){i.checked=S.layers[i.dataset.l];});}
function buildLayers(){
 var box=$('layers'),order=['lock','sensor','combo','camera','oil','route'];
 order.forEach(function(k){var n=k==='route'?'':A.filter(function(a){return a.type===k;}).length;
  var l=document.createElement('label');l.innerHTML='<input type="checkbox" id="ly-'+k+'" data-l="'+k+'" checked><span class="key '+k+'"></span><span>'+(k==='route'?'Route':esc(TYPES[k].label)+(SOON[k]?'<span class="soon">2027</span>':''))+'</span><span class="cnt">'+n+'</span>';box.appendChild(l);});
 box.addEventListener('change',function(e){S.layers[e.target.dataset.l]=e.target.checked;render();});
}
$('panel').addEventListener('click',function(e){
 var b=e.target.closest('button');if(!b)return;
 if(b.dataset.id){S.sel=b.dataset.id;render();fly(byId[S.sel]);return;}
 if(b.dataset.run){S.run=b.dataset.run;render();return;}
 if(b.dataset.say){command(b.dataset.say);return;}
 if(b.dataset.mv){var i=+b.dataset.i,j=i+(+b.dataset.mv),x=S.route[i];S.route[i]=S.route[j];S.route[j]=x;render();return;}
 if(b.dataset.rm){S.route.splice(+b.dataset.rm,1);render();return;}
 var a=byId[S.sel];
 switch(b.id){
  case 'mic':startMic();break;
  case 'mkRoute':buildRoute();S.tab='route';S.layers.route=true;syncLayers();render();fit();break;
  case 'optRoute':S.route=optimise(S.route);render();toast('Stops put in the shortest order.');break;
  case 'clrRoute':S.route=[];render();break;
  case 'sendRoute':toast('Prototype only: this would send '+S.route.length+' stops to the driver’s app.');break;
  case 'togRoute':if(a){var k=S.route.indexOf(a.id);if(k>=0)S.route.splice(k,1);else S.route.push(a.id);render();}break;
  case 'doneBtn':if(a){markDone(a);render();toast(a.name+' marked done.');}break;
 }
});
$('panel').addEventListener('submit',function(e){e.preventDefault();var v=$('vtext').value.trim();if(v)command(v);});
Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(t){t.addEventListener('click',function(){S.tab=t.dataset.tab;render();});});
$('lyTog').addEventListener('click',function(){var o=$('layers').classList.toggle('open');this.setAttribute('aria-expanded',o);});
$('z3d').addEventListener('click',function(){if(!mb)return;var on=mb.getPitch()<5;mb.easeTo({pitch:on?MB_PITCH:0,bearing:on?MB_BEARING:0,duration:700});this.classList.toggle('on',on);this.setAttribute('aria-pressed',on);});
$('zsat').addEventListener('click',function(){if(!mb)return;mbSat=!mbSat;try{mb.setConfigProperty('basemap','theme','default');}catch(e){}
 mb.setStyle(mbSat?'mapbox://styles/mapbox/standard-satellite':'mapbox://styles/mapbox/standard');
 mb.once('style.load',function(){if(!mb.getSource('route')){mb.addSource('route',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:[]}}});mb.addLayer({id:'route',type:'line',source:'route',slot:'top',layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':mbSat?'#ffffff':'#205C40','line-width':4,'line-dasharray':[1.5,1.2],'line-emissive-strength':1}});}setRouteLine();});
 this.classList.toggle('on',mbSat);this.setAttribute('aria-pressed',mbSat);});
$('zin').addEventListener('click',function(){zoom(1.4);});$('zout').addEventListener('click',function(){zoom(1/1.4);});$('zfit').addEventListener('click',fit);
$('srcBtn').addEventListener('click',function(){var p=$('srcPop');p.hidden=!p.hidden;this.setAttribute('aria-expanded',!p.hidden);});
$('mbGo').addEventListener('click',function(){var v=$('mbToken').value.trim();if(!/^pk\./.test(v)){$('mbMsg').textContent='Enter a public token starting with pk.';return;}loadMapbox(v);});
$('themeBtn').addEventListener('click',function(){var r=document.documentElement,dark=r.getAttribute('data-theme')?r.getAttribute('data-theme')==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.setAttribute('data-theme',dark?'light':'dark');});
window.addEventListener('resize',applyView);

drawBase();makeMarkers();buildLayers();buildRoute();S.sel=priorities()[0].a.id;render();fit();
$('mbToken').value=MB_TOKEN;loadMapbox(MB_TOKEN);
})();
</script>
